name: Render and release

# Renders every project that changed in a push to main and publishes each
# render as a GitHub Release, which the VPS picks up (see VPS-SETUP.md).
# Add [skip ci] to a commit message to push without rendering.

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "remotion/src/projects/**"
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name in projects/ to render"
        required: true

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick projects to render
        id: pick
        env:
          INPUT_PROJECT: ${{ inputs.project }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_PROJECT" ]; then
            names="$INPUT_PROJECT"
          else
            # A first push has no usable "before" commit; compare with the parent instead.
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
            fi
            names="$(git diff --name-only "$BEFORE" HEAD \
              | sed -nE 's#^(remotion/src/)?projects/([^/]+)/.*#\2#p' | sort -u)"
          fi
          picked=""
          for name in $names; do
            if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then
              echo "Skipping '$name' (not a project name)"; continue
            fi
            if [ ! -d "projects/$name" ] || [ ! -d "remotion/src/projects/$name" ]; then
              echo "Skipping '$name' (needs both projects/$name and remotion/src/projects/$name)"; continue
            fi
            picked="$picked $name"
          done
          echo "Rendering:${picked:- nothing}"
          echo "names=${picked# }" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.names != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion
        if: steps.pick.outputs.names != ''
        working-directory: remotion
        run: npm ci --no-fund --no-audit

      - name: Render and publish
        if: steps.pick.outputs.names != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NAMES: ${{ steps.pick.outputs.names }}
        run: |
          set -euo pipefail
          for name in $NAMES; do
            scripts/render.sh "$name"
            file="out/$name.mp4"
            tag="$name-$(date +%Y%m%d-%H%M)"
            gh release create "$tag" "$file" --repo "$GITHUB_REPOSITORY" --title "$name" --notes "Auto render"
            seconds="$(cd remotion && npx remotion ffprobe -v error -show_entries format=duration -of csv=p=0 "../$file")"
            size="$(du -h "$file" | cut -f1)"
            echo "Released $tag: ${seconds}s, $size"
            echo "- \`$tag\`: ${seconds} s, $size" >> "$GITHUB_STEP_SUMMARY"
          done
