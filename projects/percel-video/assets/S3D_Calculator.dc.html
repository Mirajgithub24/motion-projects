<div id="S3D_Display_Line2" style="font-weight: 800; font-size: 72px; line-height: 1; color: #0F1B2D">৳6 crore</div>
</div>

<div style="font-weight: 800; font-size: 92px; line-height: 1; letter-spacing: -0.02em">৳80</div>
<div style="font-family: 'Hind Siliguri', sans-serif; font-weight: 600; font-size: 26px; color: #3A4658">প্রতি পার্সেল</div>
</div>
