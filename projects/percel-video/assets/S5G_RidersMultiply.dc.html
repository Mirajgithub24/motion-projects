<g id="S5G_Five_Rider_4" transform="translate(378 626) scale(3.3)"><rect x="13" y="44" width="6" height="18" fill="#3A3F4A"></rect><rect x="21" y="44" width="6" height="18" fill="#3A3F4A"></rect><path d="M8 26 Q20 20 32 26 L30 46 L10 46 Z" fill="#FF7A1A"></path><rect x="10" y="36" width="20" height="3" fill="#E9EEF3"></rect><circle cx="20" cy="16" r="8" fill="#A9703F"></circle><path d="M11 15 A9 9 0 0 1 29 15 Z" fill="#FFFFFF" stroke="#D9D2C5" stroke-width="1"></path><rect x="18.5" y="6" width="3" height="9" fill="#FF7A1A"></rect></g>

<div id="S5G_Crowd" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px">
<sc-for list="{{crowd}}" as="r" hint-placeholder-count="20">
<svg class="s5g-rider" viewBox="0 0 40 64" aria-hidden="true" style="left: {{r.x}}px; top: {{r.y}}px; width: {{r.w}}px; height: {{r.h}}px">
<rect x="13" y="44" width="6" height="18" fill="#3A3F4A"></rect><rect x="21" y="44" width="6" height="18" fill="#3A3F4A"></rect>
<path d="M8 26 Q20 20 32 26 L30 46 L10 46 Z" fill="{{r.jacket}}"></path>
<rect x="10" y="36" width="20" height="3" fill="#E9EEF3"></rect>
<circle cx="20" cy="16" r="8" fill="{{r.skin}}"></circle>
<path d="M11 15 A9 9 0 0 1 29 15 Z" fill="#FFFFFF" stroke="#D9D2C5" stroke-width="1"></path>
<rect x="18.5" y="6" width="3" height="9" fill="#FF7A1A"></rect>
</svg>
</sc-for>
</div>

<div id="S5G_Title" style="position: absolute; left: 72px; top: 56px; display: flex; flex-direction: column; gap: 6px">
<div style="font-weight: 800; font-size: 16px; letter-spacing: 0.16em; color: #A84700">SCENE 5G · FROM FIVE TO THOUSANDS</div>
<div style="font-family: 'Hind Siliguri', sans-serif; font-weight: 700; font-size: 64px; line-height: 1.15">পাঁচজন থেকে হাজার হাজার</div>
</div>

<div id="S5G_Label_2016" style="position: absolute; left: 96px; top: 300px; display: flex; flex-direction: column; gap: 0">

<div style="display: flex; align-items: baseline; gap: 16px">
<div style="font-weight: 800; font-size: 220px; line-height: 1; letter-spacing: -0.03em">5</div>
<div style="font-family: 'Hind Siliguri', sans-serif; font-weight: 700; font-size: 44px">জন রাইডার</div>
</div>
</div>

<div id="S5G_Label_Today" style="position: absolute; left: 1180px; top: 150px; display: flex; flex-direction: column; gap: 0; background: #FFFFFF; border-radius: 24px; padding: 20px 34px; box-shadow: 0 12px 30px rgba(90,61,43,0.18)">
<div style="font-weight: 800; font-size: 34px; color: #3A4658">Today</div>
<div style="font-weight: 800; font-size: 120px; line-height: 1.05; letter-spacing: -0.02em; color: #D95400">Thousands</div>
<div style="font-family: 'Hind Siliguri', sans-serif; font-weight: 700; font-size: 40px">আজ হাজার হাজার রাইডার</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
makeCrowd() {
var seed = 47;
function r() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
var skins = ['#B57A45', '#8A5A30', '#C68E5A', '#A9703F', '#9A6638'];
var jackets = ['#FF7A1A', '#FF7A1A', '#FF7A1A', '#F06A0C', '#FF8A33'];
var out = [];
var rows = 10;
for (var j = 0; j < rows; j++) {
var scale = 0.9 + j * 0.2;
var w = Math.round(40 * scale);
var h = Math.round(64 * scale);
var count = 30 - j * 2;
var left = 840 + j * 6;
var right = 1850 - j * 6;
var step = (right - left) / count;
var baseY = 470 + j * 44;
for (var i = 0; i < count; i++) {
out.push({
x: Math.round(left + i * step + (r() * step * 0.6)),
y: Math.round(baseY + r() * 14),
w: w, h: h,
skin: skins[Math.floor(r() * skins.length)],
jacket: jackets[Math.floor(r() * jackets.length)]
});
}
}
return out;
}
renderVals() {
if (!this._crowd) { this._crowd = this.makeCrowd(); }
return { crowd: this._crowd };
}
}
</script>
</body>
</html>
