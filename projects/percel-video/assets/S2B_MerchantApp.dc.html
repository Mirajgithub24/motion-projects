<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Scene 2B: merchant panel phone mockup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Manrope:wght@500;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #FDF6E9; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; color: #0F1B2D">
<svg viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
<defs>
<pattern id="s2bDots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.5" fill="#EAD9BD"></circle></pattern>
<radialGradient id="s2bGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></radialGradient>
</defs>
<g id="S2B_App_BG">
<rect x="0" y="0" width="1920" height="1080" fill="#FDF6E9"></rect>
<rect x="0" y="0" width="1920" height="1080" fill="url(#s2bDots)"></rect>
<circle cx="960" cy="540" r="640" fill="url(#s2bGlow)"></circle>
<circle cx="330" cy="840" r="210" fill="#BFE3D6" opacity="0.6"></circle>
<circle cx="1640" cy="230" r="170" fill="#F9DC9C" opacity="0.6"></circle>
<circle cx="1560" cy="900" r="110" fill="#F6B893" opacity="0.5"></circle>
</g>
<g id="S2B_App_PhoneShadow"><ellipse cx="960" cy="1020" rx="270" ry="20" fill="#5A3D2B" opacity="0.2"></ellipse></g>
</svg>

<div id="S2B_App_Phone" style="position: absolute; left: 730px; top: 70px; width: 460px; height: 940px; box-sizing: border-box; padding: 16px; border-radius: 56px; background: #FFFFFF; border: 4px solid #D9CDBA; box-shadow: 0 30px 60px rgba(90, 61, 43, 0.22)">
<div id="S2B_App_Screen" style="width: 100%; height: 100%; box-sizing: border-box; border-radius: 42px; background: #FFF8EA; overflow: hidden; display: flex; flex-direction: column">

<div id="S2B_App_Header" style="display: flex; align-items: center; gap: 14px; padding: 34px 26px 22px 26px; background: #FFE3C7">
<svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="12" fill="#FF7A1A"></rect><rect x="12" y="14" width="24" height="20" rx="3" fill="none" stroke="#0F1B2D" stroke-width="3"></rect><path d="M17 24 L30 24 M26 19 L31 24 L26 29" fill="none" stroke="#0F1B2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="display: flex; flex-direction: column; gap: 0px">
<div style="font-weight: 700; font-size: 28px; line-height: 1.2">পার্সেল তৈরি করুন</div>
<div style="font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #3A4658">Create Parcel</div>
</div>
</div>

<form id="S2B_App_Form" style="display: flex; flex-direction: column; gap: 16px; padding: 22px 26px; margin: 0; flex-grow: 1">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="s2b-name" style="font-weight: 600; font-size: 17px; color: #3A4658">প্রাপকের নাম · Recipient name</label>
<input id="s2b-name" type="text" value="মি. হাসান" style="box-sizing: border-box; width: 100%; height: 54px; padding: 0 16px; border: 2px solid #E2D5BF; border-radius: 14px; background: #FFFFFF; font-family: 'Hind Siliguri', sans-serif; font-weight: 600; font-size: 22px; color: #0F1B2D">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="s2b-area" style="font-weight: 600; font-size: 17px; color: #3A4658">ঠিকানা · Delivery area</label>
<input id="s2b-area" type="text" value="ঢাকা" style="box-sizing: border-box; width: 100%; height: 54px; padding: 0 16px; border: 2px solid #E2D5BF; border-radius: 14px; background: #FFFFFF; font-family: 'Hind Siliguri', sans-serif; font-weight: 600; font-size: 22px; color: #0F1B2D">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="s2b-item" style="font-weight: 600; font-size: 17px; color: #3A4658">পণ্য · Item</label>
<input id="s2b-item" type="text" value="শাড়ি × ১" style="box-sizing: border-box; width: 100%; height: 54px; padding: 0 16px; border: 2px solid #E2D5BF; border-radius: 14px; background: #FFFFFF; font-family: 'Hind Siliguri', sans-serif; font-weight: 600; font-size: 22px; color: #0F1B2D">
</div>
<div id="S2B_App_CODField" style="display: flex; flex-direction: column; gap: 6px">
<label for="s2b-cod" style="font-weight: 600; font-size: 17px; color: #3A4658">ক্যাশ অন ডেলিভারি · COD amount</label>
<input id="s2b-cod" type="text" value="৳1,850" style="box-sizing: border-box; width: 100%; height: 72px; padding: 0 16px; border: 3px solid #D95400; border-radius: 14px; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 36px; color: #D95400">
</div>
<div id="S2B_App_ChargeRow" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: 14px; background: #E4F3EC">
<div style="font-weight: 600; font-size: 18px; color: #0F1B2D">ডেলিভারি চার্জ · Delivery charge</div>
<div style="font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 24px; color: #1B7D4B">৳70</div>
</div>
<button id="S2B_App_BookButton" type="button" style="margin-top: auto; height: 68px; border: 0; border-radius: 18px; background: #FF7A1A; color: #0F1B2D; font-family: 'Hind Siliguri', sans-serif; font-weight: 700; font-size: 26px; cursor: pointer; box-shadow: 0 8px 18px rgba(217, 84, 0, 0.3)">বুক করুন · Book</button>
</form>
</div>
</div>

<div id="S2B_App_Callout_COD" style="position: absolute; left: 1290px; top: 470px; display: flex; flex-direction: column; gap: 6px; padding: 22px 28px; border-radius: 20px; background: #FFFFFF; border: 2px solid #E2D5BF; box-shadow: 0 12px 28px rgba(90, 61, 43, 0.14)">
<div style="font-weight: 600; font-size: 22px; color: #3A4658">ক্যাশ অন ডেলিভারি</div>
<div style="font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 84px; line-height: 1; color: #D95400">৳1,850</div>
<div style="font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.08em; color: #3A4658">COD AMOUNT</div>
</div>

<div id="S2B_App_Callout_Seller" style="position: absolute; left: 150px; top: 250px; width: 480px; display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.16em; color: #A84700">MERCHANT PANEL · FICTIONAL APP</div>
<div style="font-weight: 700; font-size: 60px; line-height: 1.2">অর্ডার বুক করা হচ্ছে</div>
<div style="font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.5; color: #3A4658">Nusrat books the parcel from her phone in Barishal.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
