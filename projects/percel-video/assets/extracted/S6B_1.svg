<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Bar chart built from parcel boxes: about 7.5 lakh parcels a day in 2025 and about 15 lakh a day in 2030, the second bar twice the height of the first" style="position: absolute; left: 0; top: 0; display: block">
<defs>
