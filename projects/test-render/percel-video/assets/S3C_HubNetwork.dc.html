<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
makeHubs() {
var P = [[150,40],[200,90],[250,110],[270,170],[330,190],[420,180],[500,170],[560,200],[550,260],[500,290],[470,340],[480,400],[520,430],[560,470],[590,540],[600,640],[580,740],[555,770],[540,700],[520,620],[490,560],[450,540],[420,580],[370,600],[330,640],[280,660],[230,650],[180,660],[140,640],[130,560],[110,500],[90,430],[110,370],[70,320],[60,260],[100,220],[90,160],[120,100]];
function inside(x, y) {
var c = false;
for (var i = 0, j = P.length - 1; i < P.length; j = i++) {
var a = P[i], b = P[j];
if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) { c = !c; }
}
return c;
}
var seed = 5;
function r() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
var cities = [[330,380,80,105],[510,590,55,90],[490,220,28,75],[160,560,30,80],[100,300,28,70],[170,130,25,75],[340,260,26,70],[300,570,28,70]];
var out = [];
for (var k = 0; k < cities.length; k++) {
var c = cities[k], made = 0, guard = 0;
while (made < c[2]) {
guard++;
var ang = r() * Math.PI * 2;
var rad = 34 + r() * (c[3] - 34);
if (guard > 4000) { rad = 34 + r() * 20; }
var x = c[0] + Math.cos(ang) * rad;
var y = c[1] + Math.sin(ang) * rad;
if (guard <= 8000 && !inside(x, y)) { continue; }
var cx = 640 + c[0] * 1.18, cy = 70 + c[1] * 1.18;
var hx = 640 + x * 1.18, hy = 70 + y * 1.18;
out.push({
cx: Math.round(cx), cy: Math.round(cy),
x: Math.round(hx - 7), y: Math.round(hy - 6),
len: Math.round(rad * 1.18),
ang: (ang * 180 / Math.PI).toFixed(1)
});
made++;
}
}
return out;
}
renderVals() {
if (!this._hubs) { this._hubs = this.makeHubs(); }
return { hubs: this._hubs };
}
}
</script>
